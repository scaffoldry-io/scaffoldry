name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The build agent pushes with the workflow token, which does not start CI by itself.
  # Its publish job starts CI on the branch with this trigger. See docs/operations/build-agent.md.
  workflow_dispatch:
  # Nightly, so the million-row proof runs at least once a day even when no pull request touches the query path.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Line tables keep panic backtraces readable. Full debug info makes the test binaries several times larger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Branch protection requires a check named `validate`. This job is that check: it passes only
  # when the two groups of jobs below pass. See docs/operations/build-agent.md.
  validate:
    needs: [checks, rust, rust-extras, million-rows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every group passed
        run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "rust: ${{ needs.rust.result }}"
          echo "rust-extras: ${{ needs.rust-extras.result }}"
          echo "million-rows: ${{ needs.million-rows.result }}"
          test "${{ needs.checks.result }}" = success && test "${{ needs.rust.result }}" = success && test "${{ needs.rust-extras.result }}" = success && test "${{ needs.million-rows.result }}" = success

  # The governance gates and the web app. They need no Rust and no database.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Compose configuration
        run: |
          docker compose -f deploy/docker-compose.yml config

      - name: Hard Gate - Skills & Doctrine Audit
        run: |
          python3 governance/scripts/audit-skills.py

      - name: Hard Gate - App Manifest Schema
        run: |
          python3 governance/scripts/validate-manifest.py

      - name: Hard Gate - OpenAPI Description
        run: |
          python3 governance/scripts/validate-openapi.py

      - name: Hard Gate - Governance Script Tests
        run: |
          python3 -m unittest discover -s governance/scripts -p "test_*.py"

      - name: Hard Gate - Migration Numbers And Registration
        run: |
          python3 governance/scripts/check-migrations.py
      - name: Hard Gate - Web Server Path Safety Test
        run: |
          node --test deploy/server.test.mjs


      - name: Hard Gate - Build Agent Changes Stay In Bounds
        if: startsWith(github.head_ref || github.ref_name, 'agent/')
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          if gh pr list --head "$BRANCH" --state open --json labels --jq '.[].labels[].name' | grep -qx 'deps-approved'; then
            flag="--deps-approved"
          fi
          python3 governance/scripts/agent-guard.py --branch "$BRANCH" --base origin/main --head HEAD $flag

      - name: Hard Gate - License Hygiene Audit
        run: |
          python3 governance/scripts/audit-licenses.py

      - name: Hard Gate - Architecture Boundary Audit
        run: |
          python3 governance/scripts/audit-architecture.py

      - name: Hard Gate - Web Unit Tests & Build
        run: |
          npm ci
          npm test
          npm run build

  # Each test has its own database (tests/common TestDb), so cargo-nextest runs them in parallel, one
  # process per test, with the per-test time limit in .config/nextest.toml. The heavy tests
  # (governance/rust-heavy-tests.json) run on their own runner. Every test file is in exactly one group.
  # The light group is about 1,000 tests and took 25 minutes on one runner, so it runs on two. nextest gives each
  # runner the tests whose hash falls in its part, so every test runs on exactly one of them, and a test keeps its
  # runner when others are added. Each runner has its own database server, so a test that must run alone still does.
  rust:
    name: rust (${{ matrix.group }} ${{ matrix.part }}/${{ matrix.parts }})
    runs-on: ubuntu-latest
    # A hung test would hold the check, and the pull request with it, for the six hours GitHub allows. The slowest runner takes about fifteen minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: light, part: 1, parts: 2 }
          - { group: light, part: 2, parts: 2 }
          - { group: heavy, part: 1, parts: 1 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Dependencies only. The workspace crates are cleaned out before the cache is saved, so the
      # cache stays small and never holds a stale build of this repository's own code.
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.group }}-${{ runner.os }}-

      # The generated TypeScript client is compiled with tsc --strict and run with node 22 in client_ts_test.
      - name: Set up Node.js for the client tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies (the TypeScript compiler)
        run: npm ci --ignore-scripts

      - name: Install cargo-nextest
        run: |
          # Pinned. The binary is the project's own release build (Apache-2.0 or MIT).
          curl -LsSf https://get.nexte.st/0.9.148/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version

      - name: Start PostgreSQL container
        run: |
          docker compose -f deploy/docker-compose.yml up -d postgres
          timeout 30s bash -c "until docker exec scaffoldry-postgres pg_isready -U scaffoldry -d scaffoldry; do sleep 1; done"

      - name: Hard Gate - Rust Tests (${{ matrix.group }} ${{ matrix.part }}/${{ matrix.parts }})
        run: |
          args="$(python3 governance/scripts/rust-test-groups.py ${{ matrix.group }})"
          cargo nextest run --workspace $args --partition hash:${{ matrix.part }}/${{ matrix.parts }} --profile ci

      - name: Drop this repository's own build output before the cache is saved
        run: cargo clean -p scaffoldry-core -p scaffoldry-engine -p scaffoldry-policy -p scaffoldry-server

  # Three gates that are not tests of the light group's two runners: the policy library's OSCAL catalog, the doc tests,
  # and clippy. They run beside the test runners, on a runner of their own, so they lengthen none of them.
  rust-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # library_phase4_test writes the policy library's OSCAL catalog here. The gate below validates it.
      OSCAL_CATALOG_OUT: /tmp/library-catalog.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Dependencies only, as in the test runners.
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-extras-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-extras-${{ runner.os }}-

      - name: Install cargo-nextest
        run: |
          # Pinned. The binary is the project's own release build (Apache-2.0 or MIT).
          curl -LsSf https://get.nexte.st/0.9.148/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version

      - name: Start PostgreSQL container
        run: |
          docker compose -f deploy/docker-compose.yml up -d postgres
          timeout 30s bash -c "until docker exec scaffoldry-postgres pg_isready -U scaffoldry -d scaffoldry; do sleep 1; done"

      # One test reads OSCAL_CATALOG_OUT and writes the exported catalog. If none wrote it, the export is not tested.
      - name: Hard Gate - OSCAL Catalog Export
        run: |
          cargo nextest run -p scaffoldry-server --test library_phase4_test --profile ci
          python3 -m pip install jsonschema
          test -f "$OSCAL_CATALOG_OUT" || { echo "No test wrote the catalog to $OSCAL_CATALOG_OUT"; exit 1; }
          python3 governance/scripts/validate-oscal.py "$OSCAL_CATALOG_OUT"

      - name: Hard Gate - Rust Doc Tests
        run: cargo test --workspace --doc -- --test-threads=1

      - name: Hard Gate - Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Drop this repository's own build output before the cache is saved
        run: cargo clean -p scaffoldry-core -p scaffoldry-engine -p scaffoldry-policy -p scaffoldry-server

  # The million-row proof (docs/plans/row-scale.md phase 6). It seeds 1,000,000 rows of thirty fields, five indexed, runs each
  # of nine operations twenty times through the routes, and fails if the 95th percentile (the 19th of twenty) passes its limit or a read scans a table. The slowest is still printed. If a
  # limit fails here and the plan is right, the limit does not move: paste the plan and the timings into the record and stop.
  # On a pull request it runs only when the change touches the query path below. It always runs on main,
  # nightly, and by hand. A skipped run still reports success, so `validate` does not wait on it.
  million-rows:
    runs-on: ubuntu-latest
    # Two proofs seed 1,000,000 rows each. The pair took 28 minutes on a runner with the old limit of 30.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the query path changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          paths='^(crates/scaffoldry-core/migrations/|crates/scaffoldry-server/src/repository|crates/scaffoldry-server/src/service/(records|scope|access)\.rs|crates/scaffoldry-engine/src/access\.rs|crates/scaffoldry-server/tests/(million_rows|decide_benchmark)_test\.rs|crates/scaffoldry-core/src/reach\.rs|Cargo\.lock$|\.github/workflows/ci\.yml$)'
          if git diff --name-only "$BASE"...HEAD | grep -Eq "$paths"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file on the query path changed. The million-row proof runs on main and nightly."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-million-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-million-${{ runner.os }}-

      - name: Start PostgreSQL container
        if: steps.scope.outputs.run == 'true'
        run: |
          docker compose -f deploy/docker-compose.yml up -d postgres
          timeout 30s bash -c "until docker exec scaffoldry-postgres pg_isready -U scaffoldry -d scaffoldry; do sleep 1; done"

      - name: Hard Gate - Million Rows
        if: steps.scope.outputs.run == 'true'
        run: cargo test --release -p scaffoldry-server --test million_rows_test -- --ignored million_rows --nocapture --test-threads=1

      - name: Hard Gate - One decision on a large institution
        if: steps.scope.outputs.run == 'true'
        run: cargo test --release -p scaffoldry-server --test decide_benchmark_test -- --ignored --nocapture

      - name: Drop this repository's own build output before the cache is saved
        if: steps.scope.outputs.run == 'true'
        run: cargo clean --release -p scaffoldry-core -p scaffoldry-engine -p scaffoldry-policy -p scaffoldry-server
