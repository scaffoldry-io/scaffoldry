name: GCP Cloud Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write  # Required for Google Workload Identity Federation OIDC token

jobs:
  cloud-run-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Scaffoldry Desk Image
        run: |
          IMAGE_TAG="${{ vars.GCP_ARTIFACT_REGISTRY }}/scaffoldry-desk:${{ github.sha }}"
          IMAGE_LATEST="${{ vars.GCP_ARTIFACT_REGISTRY }}/scaffoldry-desk:latest"
          docker build -f deploy/Dockerfile.web -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy Scaffoldry Desk to Cloud Run
        run: |
          gcloud run deploy scaffoldry-desk \
            --image="${{ vars.GCP_ARTIFACT_REGISTRY }}/scaffoldry-desk:${{ github.sha }}" \
            --region="${{ vars.GCP_REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=5
