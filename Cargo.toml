[workspace]
members = [
    "crates/scaffoldry-core",
    "crates/scaffoldry-policy",
    "crates/scaffoldry-engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Johann van Amsterdam <johann@scaffoldry.io>"]
repository = "https://github.com/scaffoldry-io/scaffoldry"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1"] }
