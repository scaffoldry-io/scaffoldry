# Test runner settings for cargo-nextest. Each test runs in its own process, with its own database
# (tests/common TestDb), so tests run in parallel.

[profile.default]
# A test still running after `period` is reported as slow. After `terminate-after` periods it is
# stopped and fails, so one hung test cannot hold CI until the job's time limit.
slow-timeout = { period = "120s", terminate-after = 4 }

[profile.ci]
slow-timeout = { period = "120s", terminate-after = 4 }
fail-fast = false
# Wall-clock limits in some tests assume a machine that is not saturated. Four at a time matches a
# standard GitHub runner.
test-threads = 4
