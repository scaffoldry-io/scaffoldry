services:
  postgres:
    image: postgres:17-alpine
    container_name: scaffoldry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scaffoldry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scaffoldry_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-scaffoldry}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scaffoldry} -d ${POSTGRES_DB:-scaffoldry}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cloudflare Tunnel for zero-open-port edge ingress
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: scaffoldry-tunnel
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  postgres_data:
